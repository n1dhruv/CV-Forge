[project]
name = "makemyresume-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "alembic==1.16.5",
  "arq==0.28.0",
  "asyncpg==0.30.0",
  "cryptography==50.0.0",
  "fastapi==0.116.1",
  "httpx==0.28.1",
  "litellm==1.95.0",
  "pdfplumber==0.11.7",
  "pinecone==7.3.0",
  "pydantic-settings==2.10.1",
  "pyjwt[crypto]==2.10.1",
  "pypdf==6.1.1",
  "python-multipart==0.0.20",
  "python-docx==1.2.0",
  "redis==5.2.1",
  "sqlalchemy[asyncio]==2.0.43",
  "uvicorn[standard]==0.35.0",
]

[project.scripts]
app = "app.cli:main"

[dependency-groups]
dev = [
  "aiosqlite==0.21.0",
  "black==25.1.0",
  "pytest==8.4.1",
  "pytest-asyncio==1.1.0",
  "pytest-cov==6.2.1",
  "ruff==0.12.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
target-version = ["py311"]
